[package]
name = "mbongo-compute"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

description = "Reference compute worker, control plane and private data plane for Mbongo Chain"

[dependencies]
# Internal dependencies
mbongo-core = { path = "../mbongo-core" }
mbongo-verification = { path = "../mbongo-verification" }

# Async runtime
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
parity-scale-codec = { workspace = true }

# Cryptography
ed25519-dalek = { workspace = true }
blake3 = { workspace = true }
# Confidential authorization (Workstream K): content-key sealing and key
# wrapping to an attested environment key. Both crates are already in the
# lock through the libp2p noise stack; no new crate enters the workspace.
chacha20poly1305 = "0.10"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Logging
log = { workspace = true }
env_logger = { workspace = true }

# HTTP client (live chain client for the harness)
reqwest = { workspace = true }

# Utilities
hex = { workspace = true }

[[bin]]
name = "compute_harness"
path = "src/bin/compute_harness.rs"

[[bin]]
name = "compute_conformance"
path = "src/bin/compute_conformance.rs"

[[bin]]
name = "confidential_authorization"
path = "src/bin/confidential_authorization.rs"

[dev-dependencies]
criterion = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
