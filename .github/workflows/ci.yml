name: Mbongo CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------
  # Fast Checks (run on PR + push)
  # ---------------------------------------------------------
  checks:
    name: Rust Checks (fmt, clippy, test, replay)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust 1.94.0
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run unit tests
        run: cargo test --workspace --all-features --locked

      - name: Run replay harness
        run: cargo run -p mbongo-node --bin replay_harness

  # ---------------------------------------------------------
  # Devnet Convergence (run only on push to dev)
  # ---------------------------------------------------------
  devnet:
    name: Devnet Convergence Harness
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: checks
    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust 1.94.0
        uses: dtolnay/rust-toolchain@1.94.0

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2

      - name: Build workspace
        run: cargo build --workspace --locked

      - name: Run devnet harness
        run: cargo run -p mbongo-node --bin devnet_harness

  # ---------------------------------------------------------
  # Docker Devnet Bootstrap (run on PR + push)
  # ---------------------------------------------------------
  # Exercises the SAME bootstrap developers run locally: make delegates to
  # scripts/devnet/docker-devnet.sh, which drives Compose and lets the
  # convergence_probe binary decide whether the devnet converged. No
  # readiness polling, height or tip-hash comparison is reimplemented here.
  #
  # Deliberately independent of the native devnet job above: that one covers
  # the process-mode harness, this one covers the Docker/Compose path.
  docker-devnet:
    name: Docker Devnet Bootstrap
    runs-on: ubuntu-latest
    # The bootstrap already bounds itself: docker-devnet.sh waits at most
    # DEVNET_WAIT_TIMEOUT (420s) for the three nodes to become healthy, and
    # .env.ci caps readiness and convergence at 240s each, so about 15
    # minutes of bounded waiting. The remaining budget covers a cold,
    # uncached Docker build of the Rust workspace (RocksDB included), which
    # dominates the runtime on a fresh runner.
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # No Rust toolchain is installed on purpose: the workspace is compiled
      # inside the devnet image, so this job only orchestrates Docker.
      - name: Report available tooling
        run: |
          docker --version
          docker compose version
          make --version

      - name: Boot the devnet and verify convergence
        run: DEVNET_ENV=ci make devnet-up

      - name: Tear down the devnet
        if: always()
        run: DEVNET_ENV=ci make devnet-down

  # ---------------------------------------------------------
  # Monetary Policy Model (run on PR + push)
  # ---------------------------------------------------------
  # Covers the off-runtime research model under research/monetary-policy.
  # Until now nothing in CI executed it, so its accounting identities,
  # scenario guards and determinism could regress while every Rust and
  # devnet check stayed green.
  #
  # This job runs the model rather than re-implementing any of it: no
  # monetary arithmetic, no expected supply or reward figures, and no
  # invariant is duplicated in YAML. Locking today's illustrative numbers
  # into CI would freeze assumptions the RFC deliberately leaves open.
  monetary-model:
    name: Monetary Policy Model
    runs-on: ubuntu-latest
    # A stdlib-only model over 100 simulated years runs in well under a
    # second; five minutes is generous and still bounds a hang.
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Pinned to an exact minor version so a new CPython release cannot
      # change CI behaviour without a repository change. The model is
      # standard-library only: no pip install, no requirements file, no
      # virtualenv.
      - name: Install Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Report Python version
        run: python --version

      # The package directory name contains a hyphen and carries no
      # __init__.py, so `unittest discover` cannot import it. Running the
      # test file directly is the working stdlib form.
      - name: Run model unit tests
        run: python research/monetary-policy/test_model.py

      # The sensitivity study imports model.py directly, so a change to the
      # model's API can break it while the model's own tests stay green.
      # These tests guard the experimental design, not an economic outcome.
      - name: Run primary sensitivity tests
        run: python research/monetary-policy/test_primary_sensitivity.py

      # Registers extra policy families and subclasses clamp_to_cap, so it is
      # the most exposed of the three suites to a change in the model.
      - name: Run cap semantics tests
        run: python research/monetary-policy/test_cap_semantics.py

      # The CLI exits non-zero when any accounting identity is violated, so
      # its exit status is the assertion.
      - name: Run deterministic 100-year simulation
        run: |
          python research/monetary-policy/model.py \
            --scenario base --years 100 \
            --output "$RUNNER_TEMP/base-run1.csv"

      # Same scenario, same horizon, same config: the two CSVs must be
      # byte-identical. Compared directly rather than by hash, and never
      # uploaded as an artifact -- this is test evidence, not a release.
      - name: Verify byte-for-byte reproducibility
        run: |
          python research/monetary-policy/model.py \
            --scenario base --years 100 \
            --output "$RUNNER_TEMP/base-run2.csv"
          cmp "$RUNNER_TEMP/base-run1.csv" "$RUNNER_TEMP/base-run2.csv"

  # The SDK had no CI at all: its tests could pass locally and rot on dev
  # unnoticed. They matter more than usual here because they pin the numeric
  # safety guard, which exists to stop a silently rounded transaction amount
  # from ever reaching the wire.
  sdk-typescript:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    # Install, typecheck and a stdlib test runner over one small package.
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Pinned to a major version so a new Node release cannot change CI
      # behaviour without a repository change. Node 20+ is required for the
      # built-in test runner the suite uses; no test framework is installed.
      - name: Install Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Report Node version
        run: node --version
        working-directory: sdk/typescript

      # `npm ci` rather than `npm install`: it honours the lockfile exactly
      # and fails if the lockfile and manifest disagree.
      - name: Install dependencies
        run: npm ci
        working-directory: sdk/typescript

      - name: Typecheck
        run: npm run typecheck
        working-directory: sdk/typescript

      # `npm test` builds first and runs against dist/ — the artifact a
      # consumer installs, not the sources.
      - name: Run SDK tests
        run: npm test
        working-directory: sdk/typescript

      # Packs the SDK and installs the resulting tarball into a throwaway
      # project outside the repository, then imports it by package name from
      # both JavaScript and TypeScript. This is the gate that would catch a
      # `files` or `exports` change making the package uninstallable — the
      # suite above only ever sees dist/ in place.
      - name: Packed consumer smoke
        run: npm run test:consumer
        working-directory: sdk/typescript

      # The release workflow does NOT go through `npm run`: it invokes the
      # smoke directly with `node`, so `npm_execpath` is unset and the npm CLI
      # has to be found on disk. That difference is invisible to the step
      # above, and it is what failed the first real tagged release
      # (run 33349968293) after every ordinary CI run had passed.
      #
      # This reproduces the release shape on the runner: pack once, then
      # consume that exact tarball through a direct `node` invocation.
      - name: Consumer smoke, release-equivalent invocation
        shell: bash
        working-directory: sdk/typescript
        run: |
          set -euo pipefail
          pack_dir="$RUNNER_TEMP/release-shape-pack"
          mkdir -p "$pack_dir"
          npm pack --pack-destination "$pack_dir" > /dev/null

          count=$(find "$pack_dir" -maxdepth 1 -name '*.tgz' | wc -l)
          [ "$count" -eq 1 ] \
            || { echo "::error::expected exactly 1 tarball, found $count"; exit 1; }
          tarball=$(find "$pack_dir" -maxdepth 1 -name '*.tgz')

          # Direct node, exactly as the release workflow does it.
          env -u npm_execpath node scripts/consumer-smoke.mjs --tarball "$tarball"
